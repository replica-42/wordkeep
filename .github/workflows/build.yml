name: Build installers
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: mac
          - runner: windows-2025
            target: win
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.8'
      - name: Install release tools
        run: npx --yes npm@12.2.2 ci
      - name: Install frontend dependencies
        working-directory: wordkeep-app
        run: npx --yes npm@12.2.2 ci
      - name: Set application version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          npx --yes npm@12.2.2 --prefix wordkeep-app version "${RELEASE_TAG#v}"
          --no-git-tag-version --allow-same-version --ignore-scripts
      - name: Check build stage reuse and cleanup
        run: npx --yes npm@12.2.2 run test:build
      - name: Build installer
        run: npx --yes npm@12.2.2 run dist:${{ matrix.target }}
        env:
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.target == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.target == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          WORDKEEP_CODESIGN_IDENTITY: ${{ matrix.target == 'mac' && secrets.WORDKEEP_CODESIGN_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.target == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.target == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.target == 'mac' && secrets.APPLE_TEAM_ID || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wordkeep-app-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wordkeep-app-*
          path: release
          merge-multiple: true
      - name: Publish installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.exe
