[project]
name = "wordkeep-backend"
version = "0.1.0"
description = "Text analysis and word cloud backend for Wordkeep"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "replica42", email = "replica42@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "hanlp>=2.1.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "uvicorn>=0.54.0",
    "wordcloud>=1.9.6",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
packaging = [
    "pyinstaller>=6.22.3",
    "pyinstaller-hooks-contrib>=2026.10",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
markers = ["integration: requires the local application model resources"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.uv]
prerelease = "disallow"
python-preference = "only-managed"
default-groups = ["dev"]

[[tool.uv.index]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[tool.uv.build-backend]
source-include = ["tests/**", "packaging/**", "data/model-manifest.json", "data/download_models.py", "config.json", "uv.lock", ".python-version"]
